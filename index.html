body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:16px}

function quiz(f,t){var Q=t==="__test"?mix(f):D[f].topics[t].q,i=0,sc=0;
function show(){var q=Q[i],h="<p class='s'>Question "+(i+1)+" of "+Q.length+"</p><div class='bar'><i style='width:"+(i/Q.length*100)+"%'></i></div><div class='card'><b>"+esc(q[0])+"</b></div><div id='o'>";
q[1].forEach(function(o,k){h+="<button class='opt' data-k='"+k+"'>"+esc(o)+"</button>"});h+="</div><div id='fb'></div>";app.innerHTML=h;
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}})}
function pick(k){var q=Q[i],ok=k==q[2];if(ok)sc++;
app.querySelectorAll(".opt").forEach(function(b,j){b.disabled=true;if(j==q[2])b.classList.add("ok");else if(j==k)b.classList.add("bad")});
document.getElementById("fb").innerHTML="<div class='card'><b style='color:var(--"+(ok?"ok":"bad")+")'>"+(ok?"Correct":"Not quite")+"</b><div class='ex'>"+esc(q[3])+"</div></div><button class='p' id='nx'>"+(i+1<Q.length?"Next question":"See my score")+"</button>";
document.getElementById("nx").onclick=function(){i++;if(i<Q.length)show();else done()}}
function done(){save(f,t,sc,Q.length);var p=Math.round(sc/Q.length*100),m=p>=80?"Excellent work.":p>=50?"Good effort. Review the notes and try again.":"Read the notes again, then retry.";
app.innerHTML="<h1>Your score</h1><div class='card'><div class='big'>"+sc+" / "+Q.length+"</div><div>"+p+"%. "+m+"</div></div><button class='p' id='r'>Try again</button><button id='n'>"+(t==="__test"?"Topics":"Revision notes")+"</button><button id='h'>All topics</button>";
document.getElementById("r").onclick=function(){quiz(f,t)};document.getElementById("n").onclick=function(){if(t==="__test")topics(f);else revise(f,t)};document.getElementById("h").onclick=home}
show()}
home();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
